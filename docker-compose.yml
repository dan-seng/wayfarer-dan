services:
  postgres:
    image: postgres:16-alpine
    container_name: wayfarer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wayfarer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wayfarer}
      POSTGRES_DB: ${POSTGRES_DB:-wayfarer_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wayfarer} -d ${POSTGRES_DB:-wayfarer_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

